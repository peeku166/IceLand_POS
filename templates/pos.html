{% extends 'base.html' %}
{% block title %}POS - Ice Land{% endblock %}
{% block content %}
<div class="pos-container">
    <div class="menu-panel">
        <h2>Menu</h2>
        <div id="menu-container">
            <!-- JS will fill categories and items here -->
        </div>
    </div>

    <div class="cart-panel">
        <h2>Cart</h2>
        <div class="customer-name" style="display:flex; gap:10px;">
            <label style="flex:1;">Customer Name
                <input type="text" id="customer-name" placeholder="Optional">
            </label>
            <label style="flex:1;">Phone (WhatsApp)
                <input type="number" id="customer-phone" placeholder="9876543210">
            </label>
        </div>
        <table id="cart-table">
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <!-- JS inserts rows -->
            </tbody>
        </table>
        <div class="cart-total">
            Total (incl. GST): ₹<span id="cart-total-amount">0.00</span>
        </div>
        <div class="cart-actions no-print">
            <button id="btn-print-checkout">Print Bill</button>
            <button id="btn-wa-checkout" style="background-color: #25D366; color: white;">Send WhatsApp</button>
        </div>

        <div class="reprint-actions no-print">
            <h3>Last Bill Options</h3>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <button id="last-print-btn" class="secondary-btn" style="flex:1">Print Last</button>
                <button id="last-wa-btn" class="secondary-btn"
                    style="flex:1; background-color: #25D366; color: white;">WhatsApp Last</button>
            </div>
            <div>
                <input id="reprint-code" type="text" placeholder="Bill No (e.g. IL00005)">
                <button id="reprint-btn" class="secondary-btn">Reprint Bill</button>
            </div>
        </div>

        <div id="bill-print-area" class="bill-print">
            <!-- Filled by JS before printing -->
        </div>
    </div>
</div>

<!-- Custom Flavors Modal for 5/7 Wonders -->
<div id="custom-flavor-modal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
    <div class="modal-content" style="background:white; padding:20px; border-radius:8px; width:400px; max-width:90%;">
        <h3 id="custom-flavor-title">Select Scoops</h3>
        <p>Please select <span id="custom-flavor-target">0</span> scoops from the classic flavors below.</p>
        
        <div id="custom-flavor-list" style="max-height:300px; overflow-y:auto; margin-bottom:15px; border:1px solid #ccc; padding:10px; border-radius:4px;">
            <!-- Flavors will be injected here via JS -->
        </div>
        
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>Selected: <span id="custom-flavor-count">0</span> / <span id="custom-flavor-target-display">0</span></div>
            <div>
                <button id="custom-flavor-cancel" class="secondary-btn">Cancel</button>
                <button id="custom-flavor-confirm" class="primary-btn" disabled>Confirm</button>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
{% endblock %}
